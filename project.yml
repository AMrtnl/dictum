name: Dictum

options:
  bundleIdPrefix: ch.martinoli
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    # Ad-hoc by default; the Makefile switches to your Apple Development certificate
    # when it finds one, which keeps Accessibility/Microphone grants across rebuilds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  Dictum:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Helper/dictum_helper.py
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dictum
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSUIElement: true
        NSMicrophoneUsageDescription: Dictum listens only while you hold the dictation shortcut, and transcribes on this Mac.
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.martinoli.dictum
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: NO
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
